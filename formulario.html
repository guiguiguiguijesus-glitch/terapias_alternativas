</head>

                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <main>

        <div class="container py-4">

            <h1 class="titulo">CONTATO</h1>

            <div class="formulario">

                <form>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="nome">Nome</label>

                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                name="nome"
                                placeholder="Digite seu nome"
                                required
                                minlength="3"
                                maxlength="50"
                                pattern="[A-Za-zÀ-ÿ\s]+"
                                title="Digite apenas letras e espaços.">

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="sobrenome">Sobrenome</label>

                            <input
                                type="text"
                                class="form-control"
                                id="sobrenome"
                                name="sobrenome"
                                placeholder="Digite seu sobrenome"
                                required
                                minlength="2"
                                maxlength="50"
                                pattern="[A-Za-zÀ-ÿ\s]+"
                                title="Digite apenas letras e espaços.">

                        </div>

                    </div>


                    <div class="mb-3">

                        <label for="usuario">Nome de usuário</label>

                        <div class="input-group">

                            <span class="input-group-text">@</span>

                            <input
                                type="text"
                                class="form-control"
                                id="usuario"
                                name="usuario"
                                placeholder="nomeusuario"
                                required
                                minlength="4"
                                maxlength="20"
                                pattern="[A-Za-z0-9_]+"
                                title="Use apenas letras, números e _ (sublinhado).">

                        </div>

                    </div>


                    <div class="mb-3">

                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="exemplo@email.com"
                            required>

                    </div>


                    <div class="mb-3">

                        <label for="telefone">Telefone</label>

                        <input
                            type="tel"
                            class="form-control"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            required
                            pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                            title="Digite o telefone no formato (11) 99999-9999.">

                    </div>


                    <div class="mb-3">

                        <label for="endereco">Endereço</label>

                        <input
                            type="text"
                            class="form-control"
                            id="endereco"
                            name="endereco"
                            placeholder="Digite seu endereço"
                            required
                            minlength="5"
                            maxlength="100">

                    </div>


                    <div class="mb-3">

                        <label for="avaliacao">Avalie nosso site</label>

                        <select
                            class="form-select"
                            id="avaliacao"
                            name="avaliacao"
                            required>

                            <option value="" selected disabled>
                                Selecione uma nota
                            </option>

                            <option value="1">1 - Muito ruim</option>
                            <option value="2">2 - Ruim</option>
                            <option value="3">3 - Regular</option>
                            <option value="4">4 - Bom</option>
                            <option value="5">5 - Excelente</option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label for="mensagem">Comentário</label>

                        <textarea
                            class="form-control textarea-travado"
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Digite seu comentário"
                            required
                            minlength="10"
                            maxlength="500"></textarea>

                    </div>


                    <div class="botao">

						<button
							class="btn btn-primary"
							type="submit">
							Enviar mensagem
						</button>

						<button
							class="btn btn-limpar"
							type="reset">
							Limpar formulário
						</button>

					</div>

                </form>

            </div>

                    Trabalho acadêmico sem fins lucrativos
                </p>

            </footer>

        </div>

    </main>
